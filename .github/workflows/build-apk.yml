name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Build Debug APK
        run: |
          groovy="buildSrc/src/main/groovy/com/fongmi/gradle/AbiApkPackaging.groovy"
          if [ -f "$groovy" ]; then
            sed -i 's/.*mpvArchive.*/\/\/ disabled mpvArchive/g' "$groovy" || true
          fi

          sdk_path="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          printf "sdk.dir=%s\n" "$sdk_path" > local.properties

          python3 -c '
p = "app/build.gradle"
s = open(p, "r", encoding="utf-8", errors="ignore").read()
if "compileSdk" not in s:
    s = s.replace("android {", "android {\n    compileSdk = 35", 1)
    open(p, "w", encoding="utf-8").write(s)
'

          chmod +x gradlew
          ./gradlew assembleDebug --no-configuration-cache
          find . -path "*/build/outputs/apk/*" -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: warn

name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - fongmi
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Switch to official Media3 & generate compatibility stubs
        run: |
          # 1. 在 app/build.gradle 注入官方公开的 Media3 依赖，替代缺失的 lib-mpvplayer-release.aar
          if ! grep -q "androidx.media3:media3-exoplayer" app/build.gradle; then
            cat <<'EOF' >> app/build.gradle

          dependencies {
              def media3Version = "1.5.1"
              implementation "androidx.media3:media3-exoplayer:${media3Version}"
              implementation "androidx.media3:media3-exoplayer-dash:${media3Version}"
              implementation "androidx.media3:media3-exoplayer-hls:${media3Version}"
              implementation "androidx.media3:media3-exoplayer-rtsp:${media3Version}"
              implementation "androidx.media3:media3-ui:${media3Version}"
              implementation "androidx.media3:media3-session:${media3Version}"
              implementation "androidx.media3:media3-datasource:${media3Version}"
              implementation "androidx.media3:media3-datasource-okhttp:${media3Version}"
              implementation "androidx.media3:media3-extractor:${media3Version}"
              implementation "androidx.media3:media3-common:${media3Version}"
          }
          EOF
          fi

          # 2. 屏蔽 buildSrc 中对 lib-mpvplayer-release.aar 的强校验（若存在）
          if [ -f buildSrc/src/main/groovy/com/fongmi/gradle/AbiApkPackaging.groovy ]; then
            sed -i 's/.*mpvArchive.*/\/\/ disabled mpvArchive/g' buildSrc/src/main/groovy/com/fongmi/gradle/AbiApkPackaging.groovy || true
          fi

          # 3. 补全布局中缺失的 exo_* 资源 ID
          mkdir -p app/src/main/res/values
          {
            echo '<?xml version="1.0" encoding="utf-8"?>'
            echo '<resources>'
            grep -rhoE 'exo_[a-zA-Z0-9_]+' app/src | sort -u | while read -r

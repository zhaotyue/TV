name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - fongmi
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Ensure missing exo_* ids exist
        run: |
          mkdir -p app/src/main/res/values
          {
            echo '<?xml version="1.0" encoding="utf-8"?>'
            echo '<resources>'
            grep -rhoE 'exo_[a-zA-Z0-9_]+' app/src | sort -u | while read -r id_name; do
              echo "    <item type=\"id\" name=\"${id_name}\" />"
            done
            echo '</resources>'
          } > app/src/main/res/values/ci_fix_ids.xml

      - name: Generate temporary keystore and local.properties
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/ci-debug.jks" \
            -alias tvdebug \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass 123456 \
            -keypass 123456 \
            -dname "CN=TV, OU=CI, O=TV, L=City, ST=State, C=CN"

          cat <<EOF > local.properties
          sdk.dir=$ANDROID_SDK_ROOT
          storeFile=$RUNNER_TEMP/ci-debug.jks
          keyAlias=tvdebug
          storePassword=123456
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Inspect dependencies and build Debug APK
        run: |
          echo "=== libs.versions.toml ==="
          cat gradle/libs.versions.toml || true
          echo "=== app dependencies ==="
          ./gradlew :app:dependencies --configuration leanbackDebugCompileClasspath --no-configuration-cache || true
          ./gradlew assembleDebug --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_COMPILE_TASK_PARALLELISM: "true"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"

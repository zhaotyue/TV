name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - fongmi
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check branches and search aar
        run: |
          echo "=== Local & Remote Branches ==="
          git branch -a
          echo "=== Search lib-mpvplayer-release.aar via GitHub API ==="
          curl -s "https://api.github.com/search/code?q=lib-mpvplayer-release.aar" | head -c 1500 || true
          echo ""

name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare signing, local.properties and build scripts
        run: |
          groovy="buildSrc/src/main/groovy/com/fongmi/gradle/AbiApkPackaging.groovy"
          if [ -f "$groovy" ]; then
            sed -i 's/.*mpvArchive.*/\/\/ disabled mpvArchive/g' "$groovy" || true
          fi

          keystore_path="$PWD/ci-release.jks"
          keytool -genkeypair -v \
            -keystore "$keystore_path" \
            -alias tvrelease \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass 123456 \
            -keypass 123456 \
            -dname "CN=TV, OU=CI, O=TV, L=City, ST=State, C=CN"

          sdk_path="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          cat <<EOF > local.properties
          sdk.dir=$sdk_path
          storeFile=$keystore_path
          keyAlias=tvrelease
          storePassword=123456
          EOF

          echo "=== Verify local.properties ==="
          cat local.properties
          ls -lh "$keystore_path"

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-configuration-cache --stacktrace
          find . -path "*/build/outputs/apk/*" -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: warn

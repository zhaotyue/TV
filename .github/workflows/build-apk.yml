name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - fongmi
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure official Media3 dependencies and fix missing ids
        run: |
          python3 - <<'PY'
          import os, re

          gradle_path = "app/build.gradle"
          with open(gradle_path, "r", encoding="utf-8", errors="ignore") as f:
              content = f.read()

          if "androidx.media3:media3-exoplayer" not in content:
              media3_block = """
          dependencies {
              def media3Version = "1.5.1"
              implementation "androidx.media3:media3-exoplayer:${media3Version}"
              implementation "androidx.media3:media3-exoplayer-dash:${media3Version}"
              implementation "androidx.media3:media3-exoplayer-hls:${media3Version}"
              implementation "androidx.media3:media3-exoplayer-rtsp:${media3Version}"
              implementation "androidx.media3:media3-ui:${media3Version}"
              implementation "androidx.media3:media3-session:${media3Version}"
              implementation "androidx.media3:media3-datasource:${media3Version}"
              implementation "androidx.media3:media3-datasource-okhttp:${media3Version}"
              implementation "androidx.media3:media3-extractor:${media3Version}"
              implementation "androidx.media3:media3-common:${media3Version}"
          }
          """
              with open(gradle_path, "w", encoding="utf-8") as f:
                  f.write(content + media3_block)

          groovy_path = "buildSrc/src/main/groovy/com/fongmi/gradle/AbiApkPackaging.groovy"
          if os.path.exists(groovy_path):
              with open(groovy_path, "r", encoding="utf-8", errors="ignore") as f:
                  g_lines = f.readlines()
              with open(groovy_path, "w", encoding="utf-8") as f:
                  for line in g_lines:
                      if "mpvArchive" in line:
                          f.write("// " + line)
                      else:
                          f.write(line)

          ids = set()
          for root, _, files in os.walk("app/src"):
              for fn in files:
                  if fn.endswith((".xml", ".java", ".kt")):
                      p = os.path.join(root, fn)
                      try:
                          with open(p, "r", encoding="utf-8", errors="ignore") as f:
                              ids.update(re.findall(r"\bexo_[a-zA-Z0-9_]+\b", f.read()))
                      except Exception:
                          pass

          os.makedirs("app/src/main/res/values", exist_ok=True)
          xml_lines = ['<?xml version="1.0" encoding="utf-8"?>', "<resources>"]
          for name in sorted(ids):
              xml_lines.append(f'    <item type="id" name="{name}" />')
          xml_lines.append

name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Build Debug APK
        run: |
          groovy="buildSrc/src/main/groovy/com/fongmi/gradle/AbiApkPackaging.groovy"
          if [ -f "$groovy" ]; then
            sed -i 's/.*mpvArchive.*/\/\/ disabled mpvArchive/g' "$groovy" || true
          fi

          keystore_path="$PWD/ci-release.jks"
          keytool -genkeypair -v \
            -keystore "$keystore_path" \
            -alias tvrelease \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass 123456 \
            -keypass 123456 \
            -dname "CN=TV, OU=CI, O=TV, L=City, ST=State, C=CN"

          sdk_path="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          cat <<EOF > local.properties
          sdk.dir=$sdk_path
          storeFile=$keystore_path
          keyAlias=tvrelease
          storePassword=123456
          EOF

          python3 - <<'PY'
          import os
          import re

          ids = {
              "exo_duration",
              "exo_position",
              "exo_progress",
              "exo_play",
              "exo_pause",
              "exo_ffwd",
              "exo_rew",
              "exo_prev",
              "exo_next",
              "exo_subtitle",
              "exo_settings",
              "exo_fullscreen",
              "exo_buffering",
              "exo_artwork",
              "exo_shutter",
              "exo_content_frame",
              "exo_error_message",
              "exo_ad_overlay",
              "exo_buffering_view",
              "exo_controller",
              "exo_controller_placeholder",
              "exo_overlay",
              "exo_player_view",
              "exo_subtitles",
          }
          pattern = re.compile(r"\bexo_[a-zA-Z0-9_]+\b")

          for root, _, files in os.walk("."):
              norm = root.replace("\\", "/")
              if "/build/" in norm or "/.git/" in norm:
                  continue
              for fn in files:
                  if fn.endswith((".xml", ".java", ".kt")):
                      fp = os.path.join(root, fn)
                      try:
                          with open(fp, "r", encoding="utf-8", errors="ignore") as f:
                              ids.update(pattern.findall(f.read()))
                      except OSError:
                          pass

          lines = ['<?xml version="1.0" encoding="utf-8"?>', "<resources>"]
          for name in sorted(ids):
              lines.append(f'    <item type="id" name="{name}" />')
          lines.append("</resources>")
          xml_content = "\n".join(lines) + "\n"

          for target_dir in ["app/src/main/res/values", "catvod/src/main/res/values"]:
              if os.path.isdir(os.path.dirname(target_dir)):
                  os.makedirs(target_dir, exist_ok=True)
                  with open(os.path.join(target_dir, "ci_fix_ids.xml"), "w", encoding="utf-8") as f:
                      f.write(xml_content)

          print(f"Wrote {len(ids)} exo_* IDs.")
          PY

          chmod +x gradlew
          ./gradlew assembleDebug --no-configuration-cache
          find . -path "*/build/outputs/apk/*" -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: warn
